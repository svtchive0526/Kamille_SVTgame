/* v20: keep the typewriter and kanji on the same optical center. */
#loading .loading-stack{position:static;display:contents}
#loading .loading-text{position:absolute;left:0;right:0;top:50%;margin-top:-.65em;text-align:center;z-index:2;transition:opacity .65s ease,filter .65s ease}
#loading .sound-enable{position:fixed;left:50%;bottom:clamp(25px,7vh,75px);transform:translateX(-50%);z-index:100;white-space:nowrap;max-width:calc(100vw - 32px)}
#loading.third-cycle .loading-text{opacity:.48;filter:blur(2px)}
#loading.third-cycle .loading-text:before,#loading.third-cycle .loading-text:after{opacity:.25}
#title-interlude.overlap-loading .kanji-sequence{z-index:8}
#title-interlude.overlap-loading .kanji-word{position:relative;top:0;left:0}
#loading.third-cycle .sound-enable{opacity:0;pointer-events:none}
/* Third loading pass overlaps the Chinese-character title while the signal decays. */
#title-interlude.overlap-loading{background:transparent;pointer-events:none}
#title-interlude.overlap-loading .kanji-sequence{z-index:8}
#title-interlude.overlap-loading .kanji-word{text-shadow:0 0 13px rgba(255,0,0,.28)}
#title-interlude.overlap-loading::before{z-index:9}
#title-interlude.overlap-loading .glitch-band{z-index:10}
#loading.third-cycle .loading-text{animation:glitch .32s steps(2,end) infinite}
#loading.third-cycle .loading-text:before{animation:ghostA .32s steps(2,end) infinite}
#loading.third-cycle .loading-text:after{animation:ghostB .32s steps(2,end) infinite}
/* Post-login corrupted title interlude: single transparent-mask glyph, no ghost image */
#title-interlude.final div.title-symbol{opacity:1!important;visibility:visible!important;background-color:#ff0000!important;animation:none!important;display:block!important}
#title-interlude.final:not(.flash)::after{opacity:0!important;animation:none!important}
#title-interlude{position:fixed;inset:0;background:#0e0e0e;z-index:80;display:none;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
#title-interlude.active{display:flex}
#title-interlude::before{content:"";position:absolute;inset:-15%;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(150,150,150,.055) 4px,transparent 5px);mix-blend-mode:screen;z-index:5}
#title-interlude.corrupt::before{animation:screenNoise .087s steps(2,end) infinite;opacity:.52}
#title-interlude::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;background:rgba(255,255,255,0)}
#title-interlude.flash::after{animation:hardFlash .373s steps(1,end) both}
.title-symbol{width:clamp(96px,9vw,142px);aspect-ratio:102/223;height:auto;position:relative;z-index:3;opacity:0;background-color:#450000;-webkit-mask-image:var(--title-mask);mask-image:var(--title-mask);-webkit-mask-position:center;mask-position:center;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-size:contain;mask-size:contain;transform:translateZ(0)}
#title-interlude.reveal div.title-symbol{opacity:1;animation:titleColor 3.1s linear forwards}
#title-interlude.final div.title-symbol{opacity:1;background-color:#ff0000;animation:none}
#title-interlude .title-ghost{position:absolute;z-index:2;opacity:0;pointer-events:none}
#title-interlude.corrupt .title-ghost{display:none}
#title-interlude .glitch-band{position:absolute;left:-10%;width:120%;height:7%;top:45%;background:rgba(125,125,125,.13);opacity:0;z-index:6;pointer-events:none}
#title-interlude.corrupt .glitch-band{animation:bandMove .18s steps(3,end) infinite}
@keyframes titleColor{0%{background-color:#450000}100%{background-color:#ff0000}}
@keyframes titleShake{0%,45%,100%{transform:translate(0,0)}50%{transform:translate(-5px,2px) skewX(2deg)}65%{transform:translate(4px,-2px)}75%{transform:translate(-2px,0)}}
@keyframes screenNoise{0%{transform:translate(0,0)}25%{transform:translate(-7px,8px)}50%{transform:translate(8px,-6px)}75%{transform:translate(-3px,12px)}100%{transform:translate(0,0)}}
@keyframes ghostTitle{0%,40%,100%{opacity:0;transform:translate(0)}45%{opacity:.7;transform:translate(-12px,3px);filter:drop-shadow(5px 0 #ff0000)}55%{opacity:.5;transform:translate(13px,-4px)}}
@keyframes bandMove{0%,100%{opacity:0;top:8%}30%{opacity:.55;top:72%}65%{opacity:.2;top:28%}}
@keyframes hardFlash{0%{background:#555}18%{background:#050505}35%{background:#383838}48%{background:#000}65%{background:#4a4a4a}78%,100%{background:transparent}}
@keyframes finalFlicker{0%{opacity:0}20%{opacity:1}30%{opacity:.1}45%,100%{opacity:1}}

/* Absolute-black background throughout the drum-only buildup and Korean reveal. */
#title-interlude.pure-black{background:#000!important}
#title-interlude.pure-black::before,#title-interlude.pure-black::after,#title-interlude.pure-black .glitch-band{display:none!important;animation:none!important}
/* Four-character title interference sequence */
#title-interlude .kanji-sequence{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none;opacity:0}
#title-interlude.kanji-phase .kanji-sequence{opacity:1}
#title-interlude.kanji-phase .title-symbol{opacity:0!important;animation:none!important}
.kanji-word{font-family:Pretendard,"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;font-size:clamp(58px,6.3vw,100px);font-weight:800;letter-spacing:-.08em;white-space:nowrap;color:#a40000;text-shadow:0 0 8px rgba(255,0,0,.14);position:relative;line-height:1.2}
.kanji-word::before,.kanji-word::after{content:attr(data-word);position:absolute;inset:0;opacity:0;pointer-events:none}
.kanji-word.change-glitch{animation:kanjiJolt .167s steps(2,end) 1}
.kanji-word.change-glitch::before{color:#ff3333;animation:kanjiGhostLeft .167s steps(2,end) 1}
.kanji-word.change-glitch::after{color:#650000;animation:kanjiGhostRight .167s steps(2,end) 1}
@keyframes kanjiJolt{0%,100%{transform:translate(0)}20%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-1px,0)}}
@keyframes kanjiGhostLeft{0%,100%{opacity:0}20%,55%{opacity:.7;transform:translate(-5px,1px);clip-path:inset(5% 0 48% 0)}}
@keyframes kanjiGhostRight{0%,100%{opacity:0}35%,75%{opacity:.55;transform:translate(4px,-1px);clip-path:inset(53% 0 5% 0)}}
/* Burn-through transition: login remains visible beneath the advancing charred edge */
#burn-transition{position:fixed;inset:0;width:100%;height:100%;z-index:75;pointer-events:none;display:none}
#burn-transition.active{display:block}

  mask-position:center,calc(50% - 1.3px) center,calc(50% + 1.3px) center,center calc(50% - 1.3px),center calc(50% + 1.3px),calc(50% - 1px) calc(50% - 1px),calc(50% + 1px) calc(50% - 1px),calc(50% - 1px) calc(50% + 1px),calc(50% + 1px) calc(50% + 1px);

/* v22: third loading cycle dissolves into signal interference before a hard cut. */
#loading.dissolve-cycle .loading-text{opacity:0;filter:blur(7px);transition:opacity 1.2s ease,filter 1.2s ease}
#loading.dissolve-cycle::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(95,95,95,.13) 6px,transparent 8px);animation:screenNoise .12s steps(2,end) infinite}
#loading.dissolve-cycle::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;background:linear-gradient(transparent 0%,rgba(100,100,100,.15) 48%,transparent 52%);animation:bandMove .19s steps(2,end) infinite}
#title-interlude.buildup::before{opacity:.68;animation:screenNoise .055s steps(2,end) infinite}
#title-interlude.buildup .glitch-band{animation:bandMove .1s steps(3,end) infinite;opacity:.7}
/* A true silent blackout between the last kanji and Korean title. */
#title-interlude.silent-blackout{background:#000!important}
#title-interlude.silent-blackout::before,#title-interlude.silent-blackout::after,#title-interlude.silent-blackout .glitch-band,#title-interlude.silent-blackout .kanji-sequence,#title-interlude.silent-blackout .title-symbol{display:none!important;animation:none!important}

/* v29: one centered kanji title, switching every 0.1 seconds during film winding. */
#title-interlude.film-kanji .kanji-sequence{opacity:1!important;display:flex!important;justify-content:center!important;align-items:center!important;gap:0!important;padding:0 14px}
#title-interlude.film-kanji .kanji-word{font-size:clamp(48px,8vw,110px);letter-spacing:-.07em;white-space:nowrap;transition:none}
#title-interlude.film-kanji .kanji-word.film-swap{animation:filmKanjiPulse .075s steps(2,end) 1}

// Two complete typing cycles, each with a short glitch and pause.
const typedEl=document.getElementById('typed');
const typingEl=document.getElementById('typing-text');
const soundButton=document.getElementById('sound-enable');
let audioContext=null;
let soundEnabled=false;
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function keyThud(){
  if(!soundEnabled||!audioContext||audioContext.state!=='running')return;
  const t=audioContext.currentTime;
  const duration=.085;
  const buffer=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*duration),audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  let low=0;
  for(let i=0;i<data.length;i++){
    const x=i/audioContext.sampleRate;
    low=low*.84+(Math.random()*2-1)*.16;
    data[i]=(low*.8+Math.sin(2*Math.PI*105*x)*.23)*Math.exp(-x*54);
  }
  const source=audioContext.createBufferSource();source.buffer=buffer;
  const filter=audioContext.createBiquadFilter();filter.type='lowpass';filter.frequency.value=780;
  const gain=audioContext.createGain();gain.gain.value=.28;
  source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
  source.start(t);source.stop(t+duration);
}
async function enableKeyboardSound(){
  try{
    audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
    await audioContext.resume();soundEnabled=true;
    soundButton.textContent='키보드 소리 켜짐 ✓';soundButton.disabled=true;
  }catch(e){soundButton.textContent='이 브라우저에서는 소리를 재생할 수 없습니다';}
}
soundButton.addEventListener('click',enableKeyboardSound);
document.getElementById('loading').addEventListener('pointerdown',event=>{if(event.target.closest('#sound-enable'))return;if(!soundEnabled)enableKeyboardSound();},{passive:true});
async function runLoading(){
  const chars=Array.from('로딩중입니다...');
  for(let cycle=0;cycle<3;cycle++){
    typedEl.textContent='';typingEl.dataset.text='';
    typingEl.classList.remove('glitching');
    await wait(cycle===2?160:350);
    if(cycle===2){
      // Third pass: letters dissolve; only the visual signal glitch remains for 1.5s.
      const loading=document.getElementById('loading');
      loading.classList.add('third-cycle','dissolve-cycle');
      const typing=(async()=>{
        for(const char of chars){
          if(!loading.classList.contains('dissolve-cycle'))break;
          typedEl.textContent+=char;typingEl.dataset.text=typedEl.textContent;
          keyThud();await wait(105+Math.random()*85);
        }
      })();
      await wait(1500);
      // Abrupt signal cut, followed by a clean black screen and the first kanji.
      loading.classList.remove('dissolve-cycle');
      loading.classList.add('hidden-loading');
      loading.style.visibility='hidden';
      typedEl.textContent='';typingEl.dataset.text='';
      await runTitleInterlude();
      await typing;
      return;
    }
    for(const char of chars){
      typedEl.textContent+=char;typingEl.dataset.text=typedEl.textContent;
      keyThud();await wait(105+Math.random()*85);
    }
    await wait(400);
    typingEl.classList.add('glitching');await wait(1280);
    typingEl.classList.remove('glitching');await wait(280);
  }
}

function beginTitleNoise(){
  if(!audioContext||audioContext.state!=='running')return;
  endTitleNoise();
  const ctx=audioContext, length=Math.floor(ctx.sampleRate*2);
  const buffer=ctx.createBuffer(1,length,ctx.sampleRate), data=buffer.getChannelData(0);
  let last=0;
  for(let i=0;i<length;i++){
    const white=Math.random()*2-1;
    last=(last+0.055*white)/1.055;
    data[i]=(white*.67+last*.33);
  }
  const source=ctx.createBufferSource();source.buffer=buffer;source.loop=true;
  const highpass=ctx.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=320;
  const lowpass=ctx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=4200;
  const gain=ctx.createGain();gain.gain.value=0;
  source.connect(highpass);highpass.connect(lowpass);lowpass.connect(gain);gain.connect(ctx.destination);
  const now=ctx.currentTime;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.085,now+.08);
  source.start();
  const interval=setInterval(()=>{
    if(ctx.state!=='running')return;
    const t=ctx.currentTime;
    const volume=Math.random()<.24?.16:.035+Math.random()*.065;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setTargetAtTime(volume,t,.018);
  },63);
  titleNoise={source,gain,interval};
}
function endTitleNoise(immediate=false){
  if(!titleNoise)return;
  const {source,gain,interval}=titleNoise;titleNoise=null;clearInterval(interval);
  try{const t=audioContext.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setValueAtTime(0,t);source.stop(t+(immediate?.001:.16))}catch(e){}
}
function titleFlashCrackle(){
  if(!audioContext||audioContext.state!=='running')return;
  const ctx=audioContext,duration=.17,count=Math.ceil(ctx.sampleRate*duration);
  const buffer=ctx.createBuffer(1,count,ctx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<count;i++){const x=i/ctx.sampleRate;data[i]=(Math.random()*2-1)*Math.exp(-x*26)}
  const source=ctx.createBufferSource();source.buffer=buffer;
  const gain=ctx.createGain();gain.gain.value=.20;
  source.connect(gain);gain.connect(ctx.destination);source.start();source.stop(ctx.currentTime+duration);
}
// The login page remains visible while corruption intensifies and the image fades to black.
let transitionRunning=false;
function runBurnTransition(){
 if(transitionRunning)return Promise.resolve();
 transitionRunning=true;
 const canvas=document.getElementById('burn-transition');
 const ctx=canvas.getContext('2d');
 const ratio=Math.min(window.devicePixelRatio||1,2);
 const w=window.innerWidth,h=window.innerHeight;
 canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);
 canvas.classList.add('active');
 const duration=1800,start=performance.now();
 return new Promise(resolve=>{
  function frame(now){
   const t=Math.min(1,(now-start)/duration);
   const dark=Math.pow(t,1.55);
   ctx.clearRect(0,0,w,h);
   // The original login page is still visible beneath the darkening overlay.
   ctx.fillStyle=`rgba(14,14,14,${Math.min(1,dark*.98)})`;
   ctx.fillRect(0,0,w,h);
   const intensity=Math.pow(t,.8);
   const count=Math.floor(2+intensity*72);
   for(let i=0;i<count;i++){
    const y=Math.random()*h;
    const height=1+Math.random()*(2+intensity*19);
    const x=Math.random()*w;
    const length=(.1+Math.random()*.85)*w;
    const alpha=(.04+Math.random()*.24)*intensity;
    ctx.fillStyle=Math.random()<.65?`rgba(220,225,225,${alpha})`:`rgba(0,0,0,${Math.min(.95,alpha*3)})`;
    ctx.fillRect(x,y,Math.min(length,w-x),height);
   }
   // Broad horizontal signal failures grow more frequent near blackout.
   if(Math.random()<.1+intensity*.75){
    const y=Math.random()*h;
    const hh=4+Math.random()*h*.13*intensity;
    ctx.fillStyle=`rgba(0,0,0,${.18+.68*intensity})`;
    ctx.fillRect(0,y,w,hh);
   }
   if(t<1){requestAnimationFrame(frame)}
   else{
    ctx.fillStyle='#0e0e0e';ctx.fillRect(0,0,w,h);
    // Keep the blackout until the interlude is active to prevent a white flash.
    document.getElementById('title-interlude').classList.add('active','corrupt');
    canvas.classList.remove('active');transitionRunning=false;resolve();
   }
  }
  requestAnimationFrame(frame);
 });
}
// Low ceremonial drum hits generated in Web Audio; played for the three kanji reveals.
let drumMaster=null;
function drumHit(intensity=1){
 if(!audioContext||audioContext.state!=='running')return;
 const ctx=audioContext,t=ctx.currentTime;
 if(!drumMaster){drumMaster=ctx.createGain();drumMaster.gain.value=1;drumMaster.connect(ctx.destination)}
 const osc=ctx.createOscillator(),env=ctx.createGain();
 osc.type='sine';osc.frequency.setValueAtTime(125,t);
 osc.frequency.exponentialRampToValueAtTime(48,t+.28);
 env.gain.setValueAtTime(.0001,t);
 env.gain.exponentialRampToValueAtTime(.33*intensity,t+.009);
 env.gain.exponentialRampToValueAtTime(.0001,t+.56);
 osc.connect(env);env.connect(drumMaster);
 osc.start(t);osc.stop(t+.57);
 const dur=.12,buffer=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);
 const data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++){const x=i/ctx.sampleRate;data[i]=(Math.random()*2-1)*Math.exp(-x*38)}
 const src=ctx.createBufferSource(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
 src.buffer=buffer;lp.type='lowpass';lp.frequency.value=480;
 g.gain.value=.19*intensity;src.connect(lp);lp.connect(g);g.connect(drumMaster);
 src.start(t);src.stop(t+dur);
}
// Dry mechanical film advance: ratchet clicks and a faint winding motor, no glitch noise.
let filmMaster=null;
function filmWindTick(progress=0){
 if(!audioContext||audioContext.state!=='running')return;
 const ctx=audioContext,t=ctx.currentTime;
 if(!filmMaster){filmMaster=ctx.createGain();filmMaster.connect(ctx.destination)}
 const dur=.075,buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*dur),ctx.sampleRate);
 const a=buf.getChannelData(0);
 for(let i=0;i<a.length;i++){
   const x=i/ctx.sampleRate;
   a[i]=(Math.random()*2-1)*Math.exp(-x*90)*(1+.25*Math.sin(x*1100));
 }
 const src=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
 src.buffer=buf;filter.type='bandpass';filter.frequency.value=1200+progress*500;filter.Q.value=.8;
 gain.gain.value=.18+.12*progress;
 src.connect(filter);filter.connect(gain);gain.connect(filmMaster);
 src.start(t);src.stop(t+dur);
 // Subtle lower mechanical clunk accompanying each film sprocket catch.
 const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='triangle';
 osc.frequency.setValueAtTime(185,t);osc.frequency.exponentialRampToValueAtTime(75,t+.055);
 env.gain.setValueAtTime(.085,t);env.gain.exponentialRampToValueAtTime(.0001,t+.065);
 osc.connect(env);env.connect(filmMaster);osc.start(t);osc.stop(t+.07);
}
function stopFilmWinding(){
 if(!filmMaster||!audioContext)return;
 const t=audioContext.currentTime;
 filmMaster.gain.cancelScheduledValues(t);filmMaster.gain.setValueAtTime(0,t);
 filmMaster=null;
}
// Vintage film-camera shutter: sharp double mechanical clack, no bright-screen flash.
function cameraShutterClack(){
 if(!audioContext||audioContext.state!=='running')return;
 const ctx=audioContext;
 for(const [offset,volume,duration] of [[0,.45,.075],[.085,.31,.095]]){
   const t=ctx.currentTime+offset;
   const buf=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*duration),ctx.sampleRate);
   const data=buf.getChannelData(0);
   for(let i=0;i<data.length;i++){
     const x=i/ctx.sampleRate;
     data[i]=(Math.random()*2-1)*Math.exp(-x*(offset?53:75));
   }
   const src=ctx.createBufferSource(),hp=ctx.createBiquadFilter(),g=ctx.createGain();
   src.buffer=buf;hp.type='highpass';hp.frequency.value=650;
   g.gain.value=volume;src.connect(hp);hp.connect(g);g.connect(ctx.destination);
   src.start(t);src.stop(t+duration);
   const osc=ctx.createOscillator(),env=ctx.createGain();osc.type='square';
   osc.frequency.setValueAtTime(offset?145:210,t);
   osc.frequency.exponentialRampToValueAtTime(70,t+.035);
   env.gain.setValueAtTime(.095,t);env.gain.exponentialRampToValueAtTime(.0001,t+.045);
   osc.connect(env);env.connect(ctx.destination);osc.start(t);osc.stop(t+.05);
 }
}
let titlePlaying=false;
async function runTitleInterlude(){
 if(titlePlaying)return;
 titlePlaying=true;
 const screen=document.getElementById('title-interlude');
 const wordEl=document.getElementById('kanji-word');
 const symbol=screen.querySelector('div.title-symbol');
 // No fade between the loading failure and the black kanji scene.
 if(drumMaster)drumMaster.gain.value=1;
 screen.className='active kanji-phase';
 screen.style.opacity='1';
 symbol.style.opacity='';symbol.style.visibility='';symbol.style.backgroundColor='';symbol.style.animation='';
 const words=['信徒','神道','新道'];
 for(let i=0;i<words.length;i++){
   wordEl.classList.remove('change-glitch');
   wordEl.textContent=words[i];wordEl.dataset.word=words[i];
   wordEl.style.color=['#650000','#a00000','#e00000'][i];
   void wordEl.offsetWidth;wordEl.classList.add('change-glitch');
   drumHit(i===0?1:.92);
   await wait(1000); // 1 second between kanji titles
 }
 wordEl.classList.remove('change-glitch');
 // The third kanji ends with the last drum; then film winding takes over in total darkness.
 screen.classList.remove('kanji-phase','corrupt','buildup','flash');
 screen.classList.add('pure-black','film-kanji');
 wordEl.classList.remove('change-glitch');
 // Show only one centered kanji at a time, switching through all three every 100 ms.
 const filmWords=['信徒','神道','新道'];
 const kanjiRow=wordEl.parentElement;
 kanjiRow.replaceChildren(wordEl);
 wordEl.className='kanji-word';
 wordEl.style.color='#c00000';
 let filmFrame=0;
 function shuffleFilmKanji(){
   const word=filmWords[filmFrame%filmWords.length];
   wordEl.textContent=word;wordEl.dataset.word=word;
   wordEl.classList.remove('film-swap');void wordEl.offsetWidth;wordEl.classList.add('film-swap');
   filmFrame++;
 }
 shuffleFilmKanji();
 endTitleNoise(true);
 if(drumMaster && audioContext){
   const now=audioContext.currentTime;
   drumMaster.gain.cancelScheduledValues(now);
   drumMaster.gain.setValueAtTime(0,now);
 }
 const windingStart=performance.now(),windingDuration=4000;
 let nextFilmTick=0,nextFilmFrame=100;
 while(performance.now()-windingStart<windingDuration){
   const elapsed=performance.now()-windingStart;
   const progress=Math.min(1,elapsed/windingDuration);
   if(elapsed>=nextFilmTick){
     filmWindTick(progress);
     nextFilmTick=elapsed+Math.max(80,225-125*Math.pow(progress,1.65));
   }
   if(elapsed>=nextFilmFrame){
     shuffleFilmKanji();
     nextFilmFrame+=100;
   }
   await wait(Math.min(20,Math.max(1,windingDuration-elapsed)));
 }
 stopFilmWinding();
 screen.classList.remove('film-kanji');
 kanjiRow.replaceChildren(wordEl);
 // A brief silent black interval makes the shutter click and title feel abrupt.
 screen.classList.remove('kanji-phase','buildup','corrupt','flash','final');
 screen.classList.add('silent-blackout');
 wordEl.textContent='';wordEl.dataset.word='';
 symbol.style.animation='none';symbol.style.opacity='0';symbol.style.visibility='hidden';
 await wait(500); // Exactly 0.5 seconds of silent black.
 screen.classList.remove('silent-blackout');
 screen.classList.add('pure-black','final');
 symbol.style.animation='none';symbol.style.opacity='1';
 symbol.style.visibility='visible';symbol.style.backgroundColor='#ff0000';
 cameraShutterClack();
 // Final Korean title stays on screen for 2 seconds.
 await wait(2000);
 document.getElementById('app').classList.add('ready');
 screen.style.transition='opacity .65s ease';
 screen.style.opacity='0';
 await wait(680);
 screen.className='';screen.style.opacity='';screen.style.transition='';
 titlePlaying=false;
}
